<main class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">Seguridad</p>
    <h1>Cambiar contraseña</h1>
    <p class="subtitle">Debes actualizar tu contraseña temporal para continuar al panel.</p>

    <form [formGroup]="formulario" (ngSubmit)="guardar()" class="auth-form">
      <label>
        <span>Contraseña actual</span>
        <input type="password" formControlName="current_password" />
      </label>

      <label>
        <span>Nueva contraseña</span>
        <input type="password" formControlName="password" />
      </label>

      <label>
        <span>Confirmar nueva contraseña</span>
        <input type="password" formControlName="password_confirmation" />
      </label>

      @if (mensaje()) {
        <p class="message">{{ mensaje() }}</p>
      }

      <div class="actions">
        <button type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button type="button" class="ghost" (click)="salir()">Salir</button>
      </div>
    </form>
  </section>
</main>
