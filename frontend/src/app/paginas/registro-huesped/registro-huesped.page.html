<main class="registro-shell">
  <section class="registro-layout">
    <aside class="brand-panel" aria-label="Marca Hotel Juquilita">
      <img class="brand-logo" src="/logo.png" alt="Logo de Hotel Juquilita" />
      <p class="brand-kicker">Hospitalidad y tradición</p>
      <h1>Registro de huesped</h1>
      <p class="brand-copy">Cree su cuenta para administrar reservas, revisar facturas y consultar pagos desde un mismo lugar.</p>
    </aside>

    <section class="registro-card" aria-label="Formulario de registro de huesped">
      <div class="encabezado">
        <h2>Crear cuenta</h2>
        <p>Complete sus datos para acceder al portal de huespedes.</p>
      </div>

      <form [formGroup]="formulario" (ngSubmit)="enviar()" class="registro-form">
        <label>
          <span>Nombre completo</span>
          <input type="text" formControlName="name" placeholder="Ej. María López" autocomplete="name" />
          @if (nombreControl.touched && nombreControl.hasError('required')) {
            <small class="field-error">El nombre es obligatorio.</small>
          }
          @if (nombreControl.touched && nombreControl.hasError('minlength')) {
            <small class="field-error">El nombre debe tener al menos 2 caracteres.</small>
          }
        </label>

        <label>
          <span>Correo electrónico</span>
          <input type="email" formControlName="email" placeholder="nombre@correo.com" autocomplete="email" />
          @if (emailControl.touched && emailControl.hasError('required')) {
            <small class="field-error">El correo electrónico es obligatorio.</small>
          }
          @if (emailControl.touched && emailControl.hasError('email')) {
            <small class="field-error">Ingrese un correo electrónico válido.</small>
          }
        </label>

        <label>
          <span>Contraseña</span>
          <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
          @if (passwordControl.touched && passwordControl.hasError('required')) {
            <small class="field-error">La contraseña es obligatoria.</small>
          }
          @if (passwordControl.touched && passwordControl.hasError('pattern')) {
            <small class="field-error">Debe tener 8+ caracteres, mayúscula, minúscula, número y símbolo.</small>
          }
        </label>

        <label>
          <span>Confirmar contraseña</span>
          <input
            type="password"
            formControlName="password_confirmation"
            placeholder="Repita su contraseña"
            autocomplete="new-password"
          />
          @if (passwordConfirmControl.touched && passwordConfirmControl.hasError('required')) {
            <small class="field-error">Debe confirmar la contraseña.</small>
          }
          @if (passwordConfirmControl.touched && formulario.hasError('passwordMismatch')) {
            <small class="field-error">La confirmación no coincide con la contraseña.</small>
          }
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="volver">
        ¿Ya tienes cuenta?
        <a routerLink="/ingresar">Iniciar sesión</a>
      </p>
    </section>
  </section>
</main>
